spring.datasource.url=jdbc:h2:mem:career;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS profile\\;CREATE SCHEMA IF NOT EXISTS external_data
spring.datasource.username=sa
spring.datasource.password=

# H2 기본 public은 유지하고 추가 스키마는 INIT에서 준비한다. Hibernate는 테이블만 생성·정리한다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false
spring.jpa.open-in-view=false

app.storage.project-file-dir=build/test-uploads
