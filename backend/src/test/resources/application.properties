spring.datasource.url=jdbc:h2:mem:career;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# 실제 DB는 db/init/*.sql로 만들지만, 테스트는 엔티티로 job·profile 스키마를 만든다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false

app.storage.project-file-dir=build/test-uploads
