# Single source of role mappings; Java does not contain role names, families or patterns.
posting-similarity.policy-version=keyword-mvp-2
posting-similarity.max-companies=3
posting-similarity.max-postings-per-company=2
posting-similarity.max-postings=5
posting-similarity.required-capability-min-coverage=0.5
posting-similarity.required-tech-min-intersection=1
posting-similarity.minimum-total-evidence=2
posting-similarity.sparse-required-supporting-evidence=1
posting-similarity.fallback-minimum-target-features=2
posting-similarity.fallback-minimum-intersection=2
posting-similarity.job-family-expansion-enabled=false
posting-similarity.taxonomy.version=roles-mvp-2
posting-similarity.taxonomy.roles[0].code=backend
posting-similarity.taxonomy.roles[0].family=software
posting-similarity.taxonomy.roles[0].pattern=백엔드|back[ -]?end|서버\\s*(?:개발|엔지니어)|server\\s*(?:developer|engineer)
posting-similarity.taxonomy.roles[1].code=frontend
posting-similarity.taxonomy.roles[1].family=software
posting-similarity.taxonomy.roles[1].pattern=프론트엔드|front[ -]?end|웹\\s*퍼블리
posting-similarity.taxonomy.roles[2].code=fullstack
posting-similarity.taxonomy.roles[2].family=software
posting-similarity.taxonomy.roles[2].pattern=풀스택|full[ -]?stack
posting-similarity.taxonomy.roles[3].code=mobile
posting-similarity.taxonomy.roles[3].family=software
posting-similarity.taxonomy.roles[3].pattern=안드로이드|android|\\bios\\b|모바일\\s*(?:개발|엔지니어)|앱\\s*개발
posting-similarity.taxonomy.roles[4].code=embedded
posting-similarity.taxonomy.roles[4].family=software
posting-similarity.taxonomy.roles[4].pattern=임베디드|펌웨어|embedded|firmware
posting-similarity.taxonomy.roles[5].code=qa
posting-similarity.taxonomy.roles[5].family=software
posting-similarity.taxonomy.roles[5].pattern=소프트웨어\\s*(?:테스트|품질)|\\bqa\\b|테스트\\s*자동화
posting-similarity.taxonomy.roles[6].code=software
posting-similarity.taxonomy.roles[6].family=software
posting-similarity.taxonomy.roles[6].pattern=^\\s*(?:소프트웨어|sw|웹)\\s*(?:개발|개발자|엔지니어|직군|직무)?\\s*$|^\\s*(?:프로그래머|software\\s*(?:engineer|developer))\\s*$
posting-similarity.taxonomy.roles[7].code=data_engineer
posting-similarity.taxonomy.roles[7].family=data
posting-similarity.taxonomy.roles[7].pattern=데이터\\s*엔지니어|data\\s*engineer|데이터\\s*플랫폼
posting-similarity.taxonomy.roles[8].code=data_scientist
posting-similarity.taxonomy.roles[8].family=data
posting-similarity.taxonomy.roles[8].pattern=데이터\\s*(?:사이언|분석)|data\\s*(?:scientist|analyst)
posting-similarity.taxonomy.roles[9].code=ml_engineer
posting-similarity.taxonomy.roles[9].family=data
posting-similarity.taxonomy.roles[9].pattern=머신러닝|딥러닝|\\bml\\s*(?:engineer|엔지니어)|machine\\s*learning\\s*(?:engineer|엔지니어)|\\bai\\s*(?:개발|엔지니어|연구)
posting-similarity.taxonomy.roles[10].code=devops
posting-similarity.taxonomy.roles[10].family=infrastructure
posting-similarity.taxonomy.roles[10].pattern=devops|\\bsre\\b|인프라|클라우드|시스템\\s*엔지니어
posting-similarity.taxonomy.roles[11].code=security
posting-similarity.taxonomy.roles[11].family=infrastructure
posting-similarity.taxonomy.roles[11].pattern=정보\\s*보안|보안\\s*(?:개발|엔지니어|관제)|security\\s*engineer
