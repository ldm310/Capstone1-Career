# CI: develop·main 으로 오는 PR(과 합쳐진 뒤)마다, 바뀐 폴더의 시험만 돌린다.
#   job-skill/ -> pytest (GitHub 가 잠깐 띄운 PostgreSQL 에 임시 DB 를 만들어 씀, RDS·노트북 DB 는 안 건드림)
#   backend/·frontend/ 는 그 파트가 합칠 때 아래 예시 주석을 풀어 자기 명령으로 채운다(README 의 'CI 규칙').
# 바뀌지 않은 폴더의 잡은 '건너뜀'으로 끝나고, 건너뜀은 필수 검사에서 통과로 친다.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      job_skill: ${{ steps.diff.outputs.job_skill }}
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      dags: ${{ steps.diff.outputs.dags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: 바뀐 폴더 찾기
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 새 브랜치 첫 push 처럼 비교할 커밋이 없으면 모두 바뀐 것으로 본다
          if [ -z "$BASE" ] || ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null); then
            files=$(printf 'job-skill/\nbackend/\nfrontend/\n')
          fi
          echo "$files"
          for part in job-skill backend frontend; do     # 폴더가 바뀌었거나 이 파일이 바뀌면 그 잡을 돌린다
            if echo "$files" | grep -qE "^($part/|\.github/workflows/ci\.yml)"; then v=true; else v=false; fi
            echo "${part//-/_}=$v" >> "$GITHUB_OUTPUT"
          done
          # DAG 와 Airflow 단계 코드가 바뀌었을 때만 Airflow 를 깔고 DAG 시험(1~2분 더 걸림)
          dag_files='^(job-skill/airflow/|job-skill/(pipeline_tasks|notify|db_queries)\.py|job-skill/tests/test_dags\.py|\.github/workflows/ci\.yml)'
          if echo "$files" | grep -qE "$dag_files"; then v=true; else v=false; fi
          echo "dags=$v" >> "$GITHUB_OUTPUT"

  job-skill:
    needs: changes
    if: needs.changes.outputs.job_skill == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-skill
    services:
      postgres:
        image: postgres:17.6            # 노트북 career-db 와 같은 판
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career     # CI 안에서만 쓰는 임시 DB 라 비밀이 아님
          POSTGRES_DB: career
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://career:career@localhost:5432/career
      TEST_DATABASE_URL: postgresql://career:career@localhost:5432/career
      REQUIRE_DB: "1"                   # DB 를 못 쓰면 시험을 건너뛰지 말고 실패
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-skill/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (DAG 시험은 Airflow 가 있어야 해서 아래 job-skill-dags 잡에서)
        run: python -m pytest tests -q

  job-skill-dags:
    needs: changes
    if: needs.changes.outputs.dags == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-skill
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_DAGS: airflow/dags            # test_dags.py 가 읽는 DAG 폴더
      PYTHONPATH: .                         # DAG 파일이 파이프라인 모듈(pipeline_tasks 등)을 바로 불러옴
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-skill/requirements-dev.txt
      - name: Airflow 3.3.2 (노트북 이미지와 같은 판)
        run: pip install "apache-airflow==3.3.2" --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: pip install -r requirements-dev.txt
      - name: Airflow 자체 DB(sqlite) 만들기
        run: airflow db migrate
      - run: python -m pytest tests/test_dags.py -q

  # ---- backend/ (그 파트가 합칠 때 주석을 풀고 채운다 — 예: Spring Boot + Gradle)
