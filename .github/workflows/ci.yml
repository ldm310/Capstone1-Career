# CI: develop·main 으로 오는 PR(과 합쳐진 뒤)마다, 바뀐 폴더의 시험만 돌린다.
#   job-skill/ -> pytest (GitHub 가 잠깐 띄운 PostgreSQL 에 임시 DB 를 만들어 씀, RDS·노트북 DB 는 안 건드림)
#   backend/·frontend/ 는 팀원이 합칠 때 같은 모양으로 잡(job)을 더한다.
# 바뀌지 않은 폴더의 잡은 '건너뜀'으로 끝나고, 건너뜀은 필수 검사에서 통과로 친다.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      job_skill: ${{ steps.diff.outputs.job_skill }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: 바뀐 폴더 찾기
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 새 브랜치 첫 push 처럼 비교할 커밋이 없으면 모두 바뀐 것으로 본다
          if [ -z "$BASE" ] || ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null); then files="job-skill/"; fi
          echo "$files"
          if echo "$files" | grep -qE '^(job-skill/|\.github/workflows/ci\.yml)'; then
            echo "job_skill=true" >> "$GITHUB_OUTPUT"
          else
            echo "job_skill=false" >> "$GITHUB_OUTPUT"
          fi

  job-skill:
    needs: changes
    if: needs.changes.outputs.job_skill == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-skill
    services:
      postgres:
        image: postgres:17.6            # 노트북 career-db 와 같은 판
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career     # CI 안에서만 쓰는 임시 DB 라 비밀이 아님
          POSTGRES_DB: career
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://career:career@localhost:5432/career
      TEST_DATABASE_URL: postgresql://career:career@localhost:5432/career
      REQUIRE_DB: "1"                   # DB 를 못 쓰면 시험을 건너뛰지 말고 실패
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-skill/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (Airflow DAG 시험은 Airflow 가 없어 건너뜀 — 노트북 컨테이너에서 돌림)
        run: python -m pytest tests -q
