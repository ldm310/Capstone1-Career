<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1070" viewBox="0 0 1680 1070">
<style>
  text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; fill: #1a1a1a; dominant-baseline: central; text-anchor: middle; }
  .title { font-size: 24px; font-weight: 700; text-anchor: start; }
  .id { font-family: Consolas, monospace; font-size: 15px; fill: #777; text-anchor: start; }
  .lane { font-size: 18px; font-weight: 700; text-anchor: start; }
  .lanesub { font-size: 13.5px; fill: #555; text-anchor: start; }
  .badge { font-size: 14px; font-weight: 700; }
  .nt  { font-size: 15px; font-weight: 700; }
  .sub { font-size: 12.5px; fill: #666; }
  .elab { font-size: 12.5px; fill: #333; font-weight: 700; }
  .elab_l { font-size: 12.5px; fill: #333; font-weight: 700; text-anchor: start; }
  .note { font-size: 13.5px; text-anchor: start; }
  .ex { font-size: 13px; fill: #444; text-anchor: start; }
  .exh { font-size: 13px; font-weight: 700; fill: #444; text-anchor: start; }
  .ln  { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect width="1680" height="1070" fill="#fff"/>
<rect x="20" y="20" width="1640" height="1030" fill="none" stroke="#999" stroke-width="1"/>
<text class="title" x="44" y="58">② 수정 확인 — 두 가지 경우를 잡는 방법</text>
<text class="id" x="44" y="90">recheck_postings</text>
<rect x="1384" y="42" width="252" height="32" rx="16" fill="#f2f2f2" stroke="#666" stroke-width="1"/>
<text class="badge" x="1510.0" y="58">매달 3·6·9…30일 12:00</text>
<text class="lane" x="44" y="132">경우 1. 회사가 공고 내용을 고친 경우</text>
<text class="lanesub" x="44" y="155">목록의 "N시간 전 수정"을 마지막 확인 시각과 비교 → 고친 공고만 본문을 받아 해시로 진짜 바뀌었는지 확인</text>
<rect x="90" y="205" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(152.0,219) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M18.5 18.5l2.5 2.5" /><path d="M4 6h16" /><path d="M4 12h4" /><path d="M4 18h4" /></g>
<text class="nt" x="165.0" y="265">공고 목록 확인</text>
<text class="sub" x="165.0" y="307">예: "5시간 전 수정"</text>
<rect x="295" y="205" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(357.0,219) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 7v5l3 3" /></g>
<text class="nt" x="370.0" y="265">수정 시각 비교</text>
<text class="sub" x="370.0" y="192">마지막 확인보다 뒤인가?</text>
<rect x="500" y="205" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(562.0,219) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></g>
<text class="nt" x="575.0" y="265">본문 받기</text>
<text class="sub" x="575.0" y="307">그 공고만</text>
<rect x="705" y="205" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(767.0,219) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3" /><path d="M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6" /><path d="M12 11v2a14 14 0 0 0 2.5 8" /><path d="M8 15a18 18 0 0 0 1.8 6" /><path d="M4.9 19a22 22 0 0 1 -.9 -7v-1a8 8 0 0 1 12 -6.95" /></g>
<text class="nt" x="780.0" y="265">해시 비교</text>
<text class="sub" x="780.0" y="192">저장된 본문과 같은가?</text>
<rect x="910" y="205" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(972.0,219) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M11.217 19.384a3.501 3.501 0 0 0 6.783 -1.217v-5.167l-6 -3.35" /><path d="M5.214 15.014a3.501 3.501 0 0 0 4.446 5.266l4.34 -2.534v-6.946" /><path d="M6 7.63c-1.391 -.236 -2.787 .395 -3.534 1.689a3.474 3.474 0 0 0 1.271 4.745l4.263 2.514l6 -3.348" /><path d="M12.783 4.616a3.501 3.501 0 0 0 -6.783 1.217v5.067l6 3.45" /><path d="M18.786 8.986a3.501 3.501 0 0 0 -4.446 -5.266l-4.34 2.534v6.946" /><path d="M18 16.302c1.391 .236 2.787 -.395 3.534 -1.689a3.474 3.474 0 0 0 -1.271 -4.745l-4.308 -2.514l-5.955 3.42" /></g>
<text class="nt" x="985.0" y="265">LLM 다시 추출</text>
<text class="sub" x="985.0" y="307">비용 듦</text>
<rect x="1115" y="205" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(1177.0,219) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6m-8 0a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" /></g>
<text class="nt" x="1190.0" y="265">DB 저장</text>
<text class="sub" x="1190.0" y="307">마지막 확인 = 지금</text>
<rect x="295" y="360" width="150" height="86" rx="4" fill="#fff" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4"/>
<g transform="translate(357.0,374) scale(1.0833333333333333)" fill="none" stroke="#666" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" /><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" /><path d="M3 3l18 18" /></g>
<text class="nt" x="370.0" y="420">안 열어 봄</text>
<text class="sub" x="370.0" y="462">이미 본 본문 · 요청 0번</text>
<rect x="705" y="360" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(767.0,374) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M20.942 13.021a9 9 0 1 0 -9.407 7.967" /><path d="M12 7v5l3 3" /><path d="M15 19l2 2l4 -4" /></g>
<text class="nt" x="780.0" y="420">확인 시각만 갱신</text>
<text class="sub" x="780.0" y="462">LLM 0원 · 다음부터 안 봄</text>
<path class="ln" d="M240,248.0 H295" marker-end="url(#a)"/>
<path class="ln" d="M445,248.0 H500" marker-end="url(#a)"/><text class="elab" x="472.5" y="236.0">예</text>
<path class="ln" d="M650,248.0 H705" marker-end="url(#a)"/>
<path class="ln" d="M855,248.0 H910" marker-end="url(#a)"/><text class="elab" x="882.5" y="236.0">다름</text>
<path class="ln" d="M1060,248.0 H1115" marker-end="url(#a)"/>
<path class="ln" d="M370.0,291 V360" marker-end="url(#a)"/><text class="elab_l" x="378.0" y="325.5">아니오 · "등록"만 있음</text>
<path class="ln" d="M780.0,291 V360" marker-end="url(#a)"/><text class="elab_l" x="788.0" y="325.5">같음</text>
<text class="exh" x="1100" y="372">예) 마지막 확인이 3일 전일 때</text>
<text class="ex" x="1100" y="396">A  "5시간 전 수정" → 확인 뒤에 고침 → 본문 다름 → 다시 추출</text>
<text class="ex" x="1100" y="420">B  "1일 전 수정" → 확인 뒤에 고침 → 본문 같음 → 확인 시각만</text>
<text class="ex" x="1100" y="444">C  "10일 전 등록" → 고친 적 없음 → 안 열어 봄</text>
<line x1="40" y1="492" x2="1640" y2="492" stroke="#ccc" stroke-width="1"/>
<text class="lane" x="44" y="524">경우 2. 마감일이 안 지났는데 공고가 내려간 경우 (조기 마감 · 상시채용 마감)</text>
<text class="lanesub" x="44" y="547">DB에는 아직 '진행'인데 목록에서 사라진 공고 → 본문을 받아 정말 없어졌는지 확인 → 없으면 '마감'</text>
<rect x="90" y="700" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(152.0,714) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M18.5 18.5l2.5 2.5" /><path d="M4 6h16" /><path d="M4 12h4" /><path d="M4 18h4" /></g>
<text class="nt" x="165.0" y="760">공고 목록 확인</text>
<text class="sub" x="165.0" y="802">DB엔 '진행' 공고</text>
<rect x="295" y="700" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(357.0,714) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M8 8l4 4" /><path d="M12 8l-4 4" /><path d="M21 21l-6 -6" /></g>
<text class="nt" x="370.0" y="760">목록에서 사라짐</text>
<text class="sub" x="370.0" y="802">목록에 없는가?</text>
<rect x="500" y="700" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(562.0,714) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></g>
<text class="nt" x="575.0" y="760">본문 받기</text>
<text class="sub" x="575.0" y="802">그 공고만</text>
<rect x="910" y="585" width="150" height="86" rx="4" fill="#fff" stroke="#d0342c" stroke-width="1.3"/>
<g transform="translate(972.0,599) scale(1.0833333333333333)" fill="none" stroke="#d0342c" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z" /><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-10" /><path d="M10 12l4 0" /></g>
<text class="nt" x="985.0" y="645">마감 처리</text>
<text class="sub" x="985.0" y="687">상태 = '마감'</text>
<rect x="910" y="700" width="150" height="86" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/>
<g transform="translate(972.0,714) scale(1.0833333333333333)" fill="none" stroke="#1a1a1a" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3" /><path d="M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6" /><path d="M12 11v2a14 14 0 0 0 2.5 8" /><path d="M8 15a18 18 0 0 0 1.8 6" /><path d="M4.9 19a22 22 0 0 1 -.9 -7v-1a8 8 0 0 1 12 -6.95" /></g>
<text class="nt" x="985.0" y="760">해시 비교</text>
<text class="sub" x="985.0" y="802">경우 1과 같은 흐름</text>
<rect x="910" y="815" width="150" height="86" rx="4" fill="#fff" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4"/>
<g transform="translate(972.0,829) scale(1.0833333333333333)" fill="none" stroke="#666" stroke-width="1.48" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></g>
<text class="nt" x="985.0" y="875">다음 ②에서 다시</text>
<text class="sub" x="985.0" y="917">마감으로 치지 않음</text>
<path class="ln" d="M240,743.0 H295" marker-end="url(#a)"/>
<path class="ln" d="M445,743.0 H500" marker-end="url(#a)"/><text class="elab" x="472.5" y="731.0">예</text>
<path class="ln" d="M650,743.0 H672 V628.0 H910" marker-end="url(#a)"/><text class="elab" x="791.0" y="616.0">404 · 본문 없음</text>
<path class="ln" d="M650,743.0 H910" marker-end="url(#a)"/><text class="elab" x="780.0" y="731.0">본문 있음</text>
<path class="ln" d="M650,743.0 H672 V858.0 H910" marker-end="url(#a)"/><text class="elab" x="791.0" y="846.0">403 · 429 · 오류</text>
<text class="exh" x="1130" y="640">왜 따로 잡아야 하나</text>
<text class="ex" x="1130" y="664">DB에 마감일 11/30이 남아 있으면 웹에는 계속 '진행 중'으로 보인다.</text>
<text class="ex" x="1130" y="688">그래서 목록에서 사라진 공고는 본문을 열어 확인한다.</text>
<text class="ex" x="1130" y="712"></text>
<text class="ex" x="1130" y="736">마감은 되돌릴 수 없어서, 막힘(403·429)·서버 오류는</text>
<text class="ex" x="1130" y="760">마감으로 치지 않고 다음 ②에서 다시 본다.</text>
<line x1="40" y1="945" x2="1640" y2="945" stroke="#ccc" stroke-width="1"/>
<g transform="translate(90,963) scale(0.8333333333333334)" fill="none" stroke="#1f5fbf" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" /><path d="M16 3l0 4" /><path d="M8 3l0 4" /><path d="M4 11l16 0" /><path d="M8 15h2v2h-2z" /></g>
<text class="note" x="120" y="973">마감일이 연장되면: 목록에 보이는 마감일을 DB에 바로 반영 (마감일은 본문 밖이라 해시로는 안 잡힘)</text>
<g transform="translate(90,992) scale(0.8333333333333334)" fill="none" stroke="#888" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21h-7a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v6.5" /><path d="M16 3v4" /><path d="M8 3v4" /><path d="M4 11h16" /><path d="M22 22l-5 -5" /><path d="M17 22l5 -5" /></g>
<text class="note" x="120" y="1002">마감일이 이미 지난 공고: '진행 공고'(마감일 ≥ 오늘)에서 저절로 빠져서 ②가 따로 안 봄</text>
<g transform="translate(90,1021) scale(0.8333333333333334)" fill="none" stroke="#888" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 7v5l3 3" /></g>
<text class="note" x="120" y="1031">마지막 확인 = DB 본문이 사람인 본문과 같다고 마지막으로 확인된 시각 (처음 저장 · 본문 같음 · 다시 추출 성공 때 갱신)</text>
</svg>